# Runs the backend API tests. Nothing is published on the host, so this is safe
# to run next to other stacks:
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v
#
# One database container holds two small libraries and one backend image serves
# both, the way production runs many libraries from a single image:
#   demo     string IDs (aryl-1 ...), no pubchem_id column, DFT data only
#   numeric  integer IDs, a pubchem_id column, ML and DFT data

services:
  database:
    build:
      context: ./database
    shm_size: "1gb"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_data
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/demo_data/csv:/docker-entrypoint-initdb.d/csv:ro
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./database/load-data.sql:/docker-entrypoint-initdb.d/02-load-data.sql:ro
      - ./tests/fixtures/numeric-ids.sql:/docker-entrypoint-initdb.d/03-numeric-ids.sql:ro
    healthcheck:
      # The numeric library is loaded last, and the server only listens on the
      # network (-h localhost) once every init script has finished.
      test: ["CMD-SHELL", "psql -h localhost -U postgres -d test_numeric -c 'SELECT molecule_id FROM molecule LIMIT 1;' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend_demo:
    build:
      context: ./backend
    image: descriptor-backend:test
    environment: &backend_env
      POSTGRES_SERVER: database
      POSTGRES_USER: postgres
      POSTGRES_PASSWD: postgres
      POSTGRES_DB: demo_data
      API_PREFIX: demo
    entrypoint: bash prestart.sh
    depends_on:
      database:
        condition: service_healthy
    healthcheck: &backend_health
      test: ["CMD-SHELL", "/opt/conda/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/$${API_PREFIX}/version')\""]
      interval: 3s
      timeout: 3s
      retries: 40

  backend_numeric:
    image: descriptor-backend:test
    environment:
      <<: *backend_env
      POSTGRES_DB: test_numeric
      API_PREFIX: numeric
    entrypoint: bash prestart.sh
    depends_on:
      database:
        condition: service_healthy
      backend_demo:
        condition: service_healthy
    healthcheck: *backend_health

  tests:
    build:
      context: ./tests
    environment:
      API_URL: http://backend_demo:8080/api/demo
      API_URL_NUMERIC: http://backend_numeric:8080/api/numeric
    depends_on:
      backend_demo:
        condition: service_healthy
      backend_numeric:
        condition: service_healthy
